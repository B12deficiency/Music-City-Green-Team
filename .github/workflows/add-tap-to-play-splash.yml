name: Add tap-to-play splash

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add opening tap-to-play screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          css_marker = "#overlay{position:absolute;z-index:10;inset:0;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,rgba(3,11,7,.35),rgba(2,8,5,.82));backdrop-filter:blur(3px)}"
          splash_css = css_marker + "\n#splash{position:absolute;z-index:20;inset:0;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 34%,#1f5a35 0,#102d1d 34%,#07120d 76%);transition:opacity .35s ease,visibility .35s ease;touch-action:manipulation}\n#splash.hidden{opacity:0;visibility:hidden;pointer-events:none}\n#splashCard{text-align:center;width:min(100%,430px);transform:translateY(-2vh)}\n#splashMark{width:118px;height:118px;margin:0 auto 18px;border-radius:30px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 55px rgba(0,0,0,.28);font-size:64px;line-height:1}\n#splashTitle{margin:0;color:#f5f8f2;font-size:clamp(34px,10vw,54px);line-height:.92;letter-spacing:-.05em;font-weight:950;text-shadow:0 5px 25px rgba(0,0,0,.35)}\n#splashTitle span{display:block;color:#8bd18d;font-size:.64em;letter-spacing:-.02em;margin-top:9px}\n#splashTap{display:inline-block;margin-top:28px;padding:12px 20px;border-radius:999px;background:#f7cf4a;color:#152016;font-size:14px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 7px 0 #987923,0 14px 30px rgba(0,0,0,.28);animation:splashPulse 1.45s ease-in-out infinite}\n#splashSub{margin-top:18px;color:#a9bcad;font-size:11px;letter-spacing:.08em;text-transform:uppercase}\n@keyframes splashPulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.045);filter:brightness(1.08)}}"
          if css_marker not in s:
              raise SystemExit('overlay CSS marker not found')
          s = s.replace(css_marker, splash_css, 1)

          html_marker = '<div id="game" role="application" aria-label="Music City Green Team: The Game">'
          splash_html = html_marker + '\n<div id="splash" aria-label="Tap to play"><div id="splashCard"><div id="splashMark">🛻</div><h1 id="splashTitle">Music City<br>Green Team<span>THE GAME</span></h1><div id="splashTap">Tap to Play</div><div id="splashSub">Sound on recommended</div></div></div>'
          if html_marker not in s:
              raise SystemExit('game container marker not found')
          s = s.replace(html_marker, splash_html, 1)

          js_marker = "els.start.addEventListener('click',startSequence);"
          js_add = js_marker + "\nconst splash=document.getElementById('splash');\nsplash.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();splash.classList.add('hidden')},{once:true});"
          if js_marker not in s:
              raise SystemExit('start listener marker not found')
          s = s.replace(js_marker, js_add, 1)

          p.write_text(s)
          PY
          rm .github/workflows/add-tap-to-play-splash.yml
      - name: Commit splash screen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add opening tap-to-play splash screen"
          git push