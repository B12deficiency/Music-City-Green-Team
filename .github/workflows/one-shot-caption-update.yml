name: One-shot caption update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-caption-update.yml'

permissions:
  contents: write

jobs:
  update-caption:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace caption
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          old = 'THE HITCH HAS LEFT THE CHAT.'
          new = 'UH OH! UH OH! UH OH!'
          if old not in text:
              raise SystemExit('Expected caption not found')
          p.write_text(text.replace(old, new))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-caption-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-shot-caption-update.yml
          git commit -m "Replace hitch caption with uh oh"
          git push
