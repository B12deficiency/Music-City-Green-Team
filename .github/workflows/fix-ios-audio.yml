name: Fix iOS uh-oh audio

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate prerecorded uh-oh voice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak
          espeak -v en-us+m3 -s 150 -p 55 -a 180 -w uh-oh.wav "Uh oh! Uh oh! Uh oh!"
      - name: Patch game to use Web Audio voice sample
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_state = "let W=390,H=844,dpr=1,last=0,raf=0,mode='title',t=0,audio=null,state={},bestTime=null,input={left:false,right:false,reach:false},captionKey='';"
          new_state = "let W=390,H=844,dpr=1,last=0,raf=0,mode='title',t=0,audio=null,uhBuffer=null,state={},bestTime=null,input={left:false,right:false,reach:false},captionKey='';"
          old_voice = "function speakUhOh(){showSpeech('UH OH!');try{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Uh oh! Uh oh! Uh oh!');u.rate=1.08;u.pitch=.82;u.volume=.8;speechSynthesis.speak(u)}}catch(e){}}"
          new_voice = """function preloadUhOh(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audio)audio=new AC();fetch('uh-oh.wav',{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('audio');return r.arrayBuffer()}).then(b=>audio.decodeAudioData(b)).then(buf=>{uhBuffer=buf}).catch(()=>{})}catch(e){}}\npreloadUhOh();\nfunction speakUhOh(){showSpeech('UH OH!');try{if(audio&&audio.state==='suspended')audio.resume();if(audio&&uhBuffer){const src=audio.createBufferSource(),g=audio.createGain();src.buffer=uhBuffer;g.gain.value=.95;src.connect(g).connect(audio.destination);src.start();return}}catch(e){}try{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Uh oh! Uh oh! Uh oh!');u.rate=1.08;u.pitch=.82;u.volume=.9;speechSynthesis.speak(u)}}catch(e){}}"""
          if old_state not in s:
              raise SystemExit('state declaration not found')
          if old_voice not in s:
              raise SystemExit('voice function not found')
          s = s.replace(old_state, new_state, 1).replace(old_voice, new_voice, 1)
          p.write_text(s)
          PY
          rm .github/workflows/fix-ios-audio.yml
      - name: Commit iOS audio fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use prerecorded uh-oh audio for iOS Safari"
          git push
