name: Tighten hand-hitch interaction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tighten-hitch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make hitch contact precise
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "dist=Math.hypot(armX-hitch.x,armY-hitch.y),catching=input.reach&&state.arm>.83&&dist<64"
          new = "fingerX=armX+side*12,fingerY=armY,dist=Math.hypot(fingerX-hitch.x,fingerY-hitch.y),catching=input.reach&&state.arm>.9&&dist<20"
          if old not in s:
              raise SystemExit('Expected hitch-contact code not found')
          s = s.replace(old, new, 1)
          old_decay = "state.grip-=dt*(input.reach?7:3)"
          new_decay = "state.grip-=dt*(input.reach?12:5)"
          if old_decay not in s:
              raise SystemExit('Expected grip-decay code not found')
          s = s.replace(old_decay, new_decay, 1)
          p.write_text(s)
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/tighten-hitch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make hitch contact more precise"
          git push
