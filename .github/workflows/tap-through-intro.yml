name: Tap-through intro dialogue

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Make opening captions tap-through
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old_css = "#cinema{position:absolute;z-index:6;left:14px;right:14px;top:24%;display:flex;justify-content:center;pointer-events:none;opacity:0;transform:translateY(-8px) scale(.985);transition:opacity .22s,transform .22s}"
          new_css = "#cinema{position:absolute;z-index:6;left:14px;right:14px;top:24%;display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:center;pointer-events:none;opacity:0;transform:translateY(-8px) scale(.985);transition:opacity .22s,transform .22s}"
          if old_css not in s: raise SystemExit('cinema CSS not found')
          s = s.replace(old_css, new_css, 1)

          old_text_css = "#cinemaText{width:fit-content;max-width:100%;padding:14px 17px;border-radius:18px;background:rgba(5,14,9,.84);border:1px solid rgba(255,255,255,.13);box-shadow:0 8px 28px rgba(0,0,0,.26);backdrop-filter:blur(7px);color:white;text-align:center;font-weight:950;font-size:clamp(15px,4.5vw,22px);line-height:1.2;letter-spacing:.01em;overflow-wrap:anywhere}"
          new_text_css = old_text_css + "\n#cinemaPrompt{display:none;padding:6px 10px;border-radius:999px;background:rgba(5,14,9,.72);border:1px solid rgba(255,255,255,.14);color:#d7e3d8;font-size:10px;font-weight:850;letter-spacing:.13em;text-transform:uppercase;box-shadow:0 4px 14px rgba(0,0,0,.18)}"
          if old_text_css not in s: raise SystemExit('cinema text CSS not found')
          s = s.replace(old_text_css, new_text_css, 1)

          old_html = '<div id="cinema"><div id="cinemaText"></div></div>'
          new_html = '<div id="cinema"><div id="cinemaText"></div><div id="cinemaPrompt">TAP TO CONTINUE</div></div>'
          if old_html not in s: raise SystemExit('cinema HTML not found')
          s = s.replace(old_html, new_html, 1)

          old_reset = "function resetGame(){state={truckX:.66,truckVX:0,trailerX:.34,trailerVX:0,trailerPhase:rand(0,6),road:0,grip:0,uh:0,speed:42,elapsed:0,arm:0,shake:0,won:false,lost:false,nextUh:3.3,nearMiss:0,catchGlow:0,introClunk:false,potholes:[]};"
          new_reset = "function resetGame(){state={truckX:.66,truckVX:0,trailerX:.34,trailerVX:0,trailerPhase:rand(0,6),road:0,grip:0,uh:0,speed:42,elapsed:0,arm:0,shake:0,won:false,lost:false,nextUh:3.3,nearMiss:0,catchGlow:0,introClunk:false,introStage:0,potholes:[]};"
          if old_reset not in s: raise SystemExit('reset block not found')
          s = s.replace(old_reset, new_reset, 1)

          marker = "els.start.addEventListener('click',startSequence);"
          addition = marker + "\nroot.addEventListener('pointerdown',e=>{if(mode==='intro'&&state.introStage<2){e.preventDefault();state.introStage++;if(state.introStage===2){t=0;captionKey='';document.getElementById('cinemaPrompt').style.display='none'}}});"
          if marker not in s: raise SystemExit('start listener not found')
          s = s.replace(marker, addition, 1)

          start = s.index('function drawIntro(){')
          end = s.index('\nfunction updatePlay(dt){', start)
          new_intro = '''function drawIntro(){drawBackground(.016);const prompt=document.getElementById('cinemaPrompt');if(state.introStage<2){const travel=clamp(t/2.4,0,1),ty=lerp(H*.72,H*.49,travel),tr={x:W*.5,y:ty,w:78,h:156},tl={x:W*.5,y:ty+148,w:68,h:122};drawTruck(tr);drawTrailer(tl);line(tr.x,tr.y+tr.h*.54,tl.x,tl.y-tl.h*.52,4,'#555');prompt.style.display='block';if(state.introStage===0)cinema('day','JUST ANOTHER DAY IN MUSIC CITY...');else cinema('secure','MOWER SECURED. TRAILER SECURED. PROBABLY.')}else{prompt.style.display='none';const q=t,drift=clamp(q/2.5,0,1),tr={x:W*(.55+.05*drift),y:H*.50,w:78,h:156},tl={x:W*(.5-.22*drift),y:H*(.67-.10*drift),w:68,h:122};drawTruck(tr);drawTrailer(tl);if(q<.7)drawSpark(W*.5,H*.59,9);cinema('hitch','UH OH! UH OH! UH OH!');if(!state.introClunk){state.introClunk=true;clunk();speakUhOh()}if(t>=3.9){cinema('play','');mode='play';t=0;state.elapsed=0;els.controls.classList.add('active');els.catchWrap.style.opacity='1';toast('GET BESIDE THE TRAILER — THEN HOLD REACH!')}}}'''
          s = s[:start] + new_intro + s[end:]
          p.write_text(s)
          PY
          rm .github/workflows/tap-through-intro.yml
      - name: Commit intro interaction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require taps to advance opening dialogue"
          git push